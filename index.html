        high: { threshold: -17, ratio: 2.5, attack: 0.003, release: 0.1, makeup: 0.5 },
      },

      },

function buildChain(ctx, params) {
  const input = ctx.createGain();

  const eqLowShelf = ctx.createBiquadFilter();
  eqLowShelf.type = "lowshelf";
  eqLowShelf.frequency.value = params.eq.lowShelf.freq;
  eqLowShelf.gain.value = params.eq.lowShelf.gain;

  const eqLowMid = ctx.createBiquadFilter();
  eqLowMid.type = "peaking";
  eqLowMid.frequency.value = params.eq.lowMid.freq;
  eqLowMid.Q.value = params.eq.lowMid.q;
  eqLowMid.gain.value = params.eq.lowMid.gain;

  const eqHighMid = ctx.createBiquadFilter();
  eqHighMid.type = "peaking";
  eqHighMid.frequency.value = params.eq.highMid.freq;
  eqHighMid.Q.value = params.eq.highMid.q;
  eqHighMid.gain.value = params.eq.highMid.gain;

  const eqHighShelf = ctx.createBiquadFilter();
  eqHighShelf.type = "highshelf";
  eqHighShelf.frequency.value = params.eq.highShelf.freq;
  eqHighShelf.gain.value = params.eq.highShelf.gain;

  input.connect(eqLowShelf);
  eqLowShelf.connect(eqLowMid);
  eqLowMid.connect(eqHighMid);
  eqHighMid.connect(eqHighShelf);

  const bandSplitPoint = eqHighShelf;

  const lowLP = ctx.createBiquadFilter();
  lowLP.type = "lowpass";
  lowLP.frequency.value = params.crossover.lowMid;
  lowLP.Q.value = 0.707;

  const midHP = ctx.createBiquadFilter();
  midHP.type = "highpass";
  midHP.frequency.value = params.crossover.lowMid;
  midHP.Q.value = 0.707;
  const midLP = ctx.createBiquadFilter();
  midLP.type = "lowpass";
  midLP.frequency.value = params.crossover.midHigh;
  midLP.Q.value = 0.707;

  const highHP = ctx.createBiquadFilter();
  highHP.type = "highpass";
  highHP.frequency.value = params.crossover.midHigh;
  highHP.Q.value = 0.707;

  bandSplitPoint.connect(lowLP);
  bandSplitPoint.connect(midHP);
  midHP.connect(midLP);
  bandSplitPoint.connect(highHP);

  function makeCompressor(bandParams) {
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = bandParams.threshold;
    comp.ratio.value = bandParams.ratio;
    comp.attack.value = bandParams.attack;
    comp.release.value = bandParams.release;
    comp.knee.value = 6;
    const makeup = ctx.createGain();
    makeup.gain.value = dbToGain(bandParams.makeup);
    comp.connect(makeup);
    return { comp, makeup };
  }

  const lowComp = makeCompressor(params.bands.low);
  const midComp = makeCompressor(params.bands.mid);
  const highComp = makeCompressor(params.bands.high);

  lowLP.connect(lowComp.comp);
  midLP.connect(midComp.comp);
  highHP.connect(highComp.comp);

  const sum = ctx.createGain();
  lowComp.makeup.connect(sum);
  midComp.makeup.connect(sum);
  highComp.makeup.connect(sum);

  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = params.limiter.threshold;
  limiter.ratio.value = 20;
  limiter.attack.value = 0.001;
  limiter.release.value = params.limiter.release;
  limiter.knee.value = 0;

  const outGain = ctx.createGain();
  outGain.gain.value = dbToGain(params.outputTrim);

  sum.connect(limiter);
  limiter.connect(outGain);

  return {
    input,
    output: outGain,
    nodes: {
      eqLowShelf, eqLowMid, eqHighMid, eqHighShelf,
      lowLP, midHP, midLP, highHP,
      lowComp, midComp, highComp,
      limiter, outGain,
    },
  };
}

function encodeWav(audioBuffer) {
  const numCh = audioBuffer.numberOfChannels;
  const len = audioBuffer.length;
  const sampleRate = audioBuffer.sampleRate;
  const bytesPerSample = 2;
  const blockAlign = numCh * bytesPerSample;
  const dataSize = len * blockAlign;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeStr(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeStr(36, "data");
  view.setUint32(40, dataSize, true);

  const channels = [];
  for (let c = 0; c < numCh; c++) channels.push(audioBuffer.getChannelData(c));

  let offset = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < numCh; c++) {
      const s = clamp(channels[c][i], -1, 1);
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      offset += 2;
    }
  }
  return new Blob([view], { type: "audio/wav" });
}

function VUMeter({ level }) {
  const angle = -55 + clamp((level + 40) / 40, 0, 1) * 110;
  const danger = level > -1;
  return (
    <svg viewBox="0 0 200 130" style={{ width: "100%", maxWidth: 220 }}>
      <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke={COLORS.hairline} strokeWidth="2" />
      {[...Array(9)].map((_, i) => {
        const a = (-55 + (i / 8) * 110) * (Math.PI / 180);
        const x1 = 100 + Math.sin(a) * 72, y1 = 110 - Math.cos(a) * 72;
        const x2 = 100 + Math.sin(a) * 80, y2 = 110 - Math.cos(a) * 80;
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={i >= 7 ? COLORS.red : COLORS.textMuted} strokeWidth="1.5" />;
      })}
      <line
        x1="100" y1="110"
        x2={100 + Math.sin(angle * Math.PI / 180) * 64}
        y2={110 - Math.cos(angle * Math.PI / 180) * 64}
        stroke={danger ? COLORS.red : COLORS.copper}
        strokeWidth="2"
        style={{ transition: "all 0.08s linear" }}
      />
      <circle cx="100" cy="110" r="4" fill={COLORS.amber} />
      <text x="100" y="126" textAnchor="middle" fontSize="10" fontFamily={FONT_MONO} fill={COLORS.textSecondary}>
        {level > -60 ? `${fmt(level, 1)} dB` : "-- dB"}
      </text>
    </svg>
  );
}

}

function MasteringConsole() {
  const [params, setParams] = useState(defaultParams());
  const [selectedPreset, setSelectedPreset] = useState(null);
  const [fileName, setFileName] = useState(null);
  const [status, setStatus] = useState("idle");
  const [isPlaying, setIsPlaying] = useState(false);
  const [bypass, setBypass] = useState(false);
  const [peakLevel, setPeakLevel] = useState(-60);
  const [rmsLevel, setRmsLevel] = useState(-60);
  const [lufsApprox, setLufsApprox] = useState(-60);
  const [duration, setDuration] = useState(0);
  const [progress, setProgress] = useState(0);
  const [exporting, setExporting] = useState(false);
  const [activeTab, setActiveTab] = useState("konsol");
  const [newPresetName, setNewPresetName] = useState("");
  const [customPresets, setCustomPresets] = useState(() => {
    try {
      const raw = localStorage.getItem("masteringConsoleCustomPresets");
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  });
  const [stems, setStems] = useState([]);
  const [mixing, setMixing] = useState(false);
  const [stemPreviewPlaying, setStemPreviewPlaying] = useState(false);
  const stemIdRef = useRef(0);
  const stemFileInputRef = useRef(null);
  const stemPreviewNodesRef = useRef({});

  const ctxRef = useRef(null);
  const bufferRef = useRef(null);
  const sourceRef = useRef(null);
  const chainRef = useRef(null);
  const analyserRef = useRef(null);
  const dryGainRef = useRef(null);
  const wetGainRef = useRef(null);
  const rafRef = useRef(null);
  const startTimeRef = useRef(0);
  const pauseOffsetRef = useRef(0);
  const canvasRef = useRef(null);
  const fileInputRef = useRef(null);
  const paramsRef = useRef(params);
  const lufsSmoothRef = useRef(0);
  const freqCanvasRef = useRef(null);
  const lowGRRef = useRef(null);
  const midGRRef = useRef(null);
  const highGRRef = useRef(null);
  const frameCountRef = useRef(0);
  paramsRef.current = params;

  const ensureCtx = useCallback(() => {
    if (!ctxRef.current) {
      ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (ctxRef.current.state === "suspended") {
      ctxRef.current.resume();
    }
    return ctxRef.current;
  }, []);

  const drawWaveform = useCallback((buffer) => {
    const canvas = canvasRef.current;
    if (!canvas || !buffer) return;
    const ctx2d = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx2d.clearRect(0, 0, w, h);
    const data = buffer.getChannelData(0);
    const step = Math.ceil(data.length / w);
    ctx2d.fillStyle = COLORS.copperDim;
    for (let x = 0; x < w; x++) {
      let min = 1.0, max = -1.0;
      for (let i = 0; i < step; i++) {
        const idx = x * step + i;
        if (idx >= data.length) break;
        const v = data[idx];
        if (v < min) min = v;
        if (v > max) max = v;
      }
      const y1 = (1 + min) * 0.5 * h;
      const y2 = (1 + max) * 0.5 * h;
      ctx2d.fillRect(x, y1, 1, Math.max(1, y2 - y1));
    }
  }, []);

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setStatus("decoding");
    const ctx = ensureCtx();
    const arrayBuf = await file.arrayBuffer();
    const audioBuffer = await ctx.decodeAudioData(arrayBuf);
    bufferRef.current = audioBuffer;
    setFileName(file.name);
    setDuration(audioBuffer.duration);
    drawWaveform(audioBuffer);
    setStatus("ready");
  }

  function stopPlayback() {
    if (sourceRef.current) {
      try { sourceRef.current.stop(); } catch (err) {}
      sourceRef.current.disconnect();
      sourceRef.current = null;
    }
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    setIsPlaying(false);
  }

  function play(offset = 0) {
    const ctx = ensureCtx();
    if (!bufferRef.current) return;
    if (ctx.state === "suspended") { ctx.resume(); }
    stopPlayback();

    const source = ctx.createBufferSource();
    source.buffer = bufferRef.current;

    const chain = buildChain(ctx, paramsRef.current);
    chainRef.current = chain;

    const dryGain = ctx.createGain();
    const wetGain = ctx.createGain();
    dryGain.gain.value = bypass ? 1 : 0;
    wetGain.gain.value = bypass ? 0 : 1;
    dryGainRef.current = dryGain;
    wetGainRef.current = wetGain;

    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyserRef.current = analyser;

    source.connect(dryGain);
    source.connect(chain.input);
    chain.output.connect(wetGain);
    dryGain.connect(analyser);
    wetGain.connect(analyser);
    analyser.connect(ctx.destination);

    source.start(0, offset);
    startTimeRef.current = ctx.currentTime - offset;
    sourceRef.current = source;
    source.onended = () => {
      setIsPlaying(false);
      pauseOffsetRef.current = 0;
      setProgress(0);
    };
    setIsPlaying(true);
    tick();
  }

  function tick() {
    const ctx = ctxRef.current;
    const analyser = analyserRef.current;
    if (ctx && analyser && sourceRef.current) {
      const data = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(data);
      let peak = 0, sumSq = 0;
      for (let i = 0; i < data.length; i++) {
        const v = Math.abs(data[i]);
        if (v > peak) peak = v;
        sumSq += data[i] * data[i];
      }
      const rms = Math.sqrt(sumSq / data.length);
      setPeakLevel(peak > 0 ? 20 * Math.log10(peak) : -60);
      setRmsLevel(rms > 0 ? 20 * Math.log10(rms) : -60);

      const power = rms * rms;
      lufsSmoothRef.current = lufsSmoothRef.current * 0.985 + power * 0.015;
      const lufsDb = lufsSmoothRef.current > 0 ? 10 * Math.log10(lufsSmoothRef.current) - 0.691 : -60;

      const elapsed = ctx.currentTime - startTimeRef.current;
      setProgress(clamp(elapsed / bufferRef.current.duration, 0, 1));

      frameCountRef.current++;
      if (frameCountRef.current % 4 === 0) {
        setLufsApprox(lufsDb);
      }

      if (freqCanvasRef.current) {
        const freqData = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(freqData);
        drawSpectrum(freqData);
      }

      const chain = chainRef.current;
      if (chain) {
        const lowGR = chain.nodes.lowComp.comp.reduction || 0;
        const midGR = chain.nodes.midComp.comp.reduction || 0;
        const highGR = chain.nodes.highComp.comp.reduction || 0;
        if (lowGRRef.current) lowGRRef.current.style.width = `${clamp((-lowGR / 24) * 100, 0, 100)}%`;
        if (midGRRef.current) midGRRef.current.style.width = `${clamp((-midGR / 24) * 100, 0, 100)}%`;
        if (highGRRef.current) highGRRef.current.style.width = `${clamp((-highGR / 24) * 100, 0, 100)}%`;
      }
    }
    rafRef.current = requestAnimationFrame(tick);
  }

  function drawSpectrum(freqData) {
    const canvas = freqCanvasRef.current;
    if (!canvas) return;
    const ctx2d = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx2d.clearRect(0, 0, w, h);
    const barCount = 56;
    const usableBins = Math.floor(freqData.length * 0.6);
    const binsPerBar = Math.max(1, Math.floor(usableBins / barCount));
    const barWidth = w / barCount;
    for (let i = 0; i < barCount; i++) {
      let sum = 0;
      for (let j = 0; j < binsPerBar; j++) {
        sum += freqData[i * binsPerBar + j] || 0;
      }
      const avg = sum / binsPerBar;
      const barH = (avg / 255) * h;
      ctx2d.fillStyle = avg > 210 ? COLORS.red : i < barCount * 0.35 ? COLORS.copper : COLORS.teal;
      ctx2d.fillRect(i * barWidth, h - barH, barWidth - 1, barH);
    }
  }

  function togglePlay() {
    if (!bufferRef.current) return;
    stopStemPreview();
    if (isPlaying) {
      pauseOffsetRef.current = ctxRef.current.currentTime - startTimeRef.current;
      stopPlayback();
    } else {
      play(pauseOffsetRef.current >= (bufferRef.current?.duration || 0) ? 0 : pauseOffsetRef.current);
    }
  }

  function restartWithCurrentParams() {
    if (isPlaying) {
      const offset = ctxRef.current.currentTime - startTimeRef.current;
      play(offset);
    }
  }

  useEffect(() => {
    if (dryGainRef.current && wetGainRef.current) {
      const ctx = ctxRef.current;
      const now = ctx.currentTime;
      dryGainRef.current.gain.setTargetAtTime(bypass ? 1 : 0, now, 0.02);
      wetGainRef.current.gain.setTargetAtTime(bypass ? 0 : 1, now, 0.02);
    }
  }, [bypass]);

  useEffect(() => {
    const chain = chainRef.current;
    if (!chain) return;
    const p = params;
    const n = chain.nodes;
    n.eqLowShelf.frequency.value = p.eq.lowShelf.freq;
    n.eqLowShelf.gain.value = p.eq.lowShelf.gain;
    n.eqLowMid.frequency.value = p.eq.lowMid.freq;
    n.eqLowMid.Q.value = p.eq.lowMid.q;
    n.eqLowMid.gain.value = p.eq.lowMid.gain;
    n.eqHighMid.frequency.value = p.eq.highMid.freq;
    n.eqHighMid.Q.value = p.eq.highMid.q;
    n.eqHighMid.gain.value = p.eq.highMid.gain;
    n.eqHighShelf.frequency.value = p.eq.highShelf.freq;
    n.eqHighShelf.gain.value = p.eq.highShelf.gain;

    n.lowLP.frequency.value = p.crossover.lowMid;
    n.midHP.frequency.value = p.crossover.lowMid;
    n.midLP.frequency.value = p.crossover.midHigh;
    n.highHP.frequency.value = p.crossover.midHigh;

    n.lowComp.comp.threshold.value = p.bands.low.threshold;
    n.lowComp.comp.ratio.value = p.bands.low.ratio;
    n.lowComp.comp.attack.value = p.bands.low.attack;
    n.lowComp.comp.release.value = p.bands.low.release;
    n.lowComp.makeup.gain.value = dbToGain(p.bands.low.makeup);

    n.midComp.comp.threshold.value = p.bands.mid.threshold;
    n.midComp.comp.ratio.value = p.bands.mid.ratio;
    n.midComp.comp.attack.value = p.bands.mid.attack;
    n.midComp.comp.release.value = p.bands.mid.release;
    n.midComp.makeup.gain.value = dbToGain(p.bands.mid.makeup);

    n.highComp.comp.threshold.value = p.bands.high.threshold;
    n.highComp.comp.ratio.value = p.bands.high.ratio;
    n.highComp.comp.attack.value = p.bands.high.attack;
    n.highComp.comp.release.value = p.bands.high.release;
    n.highComp.makeup.gain.value = dbToGain(p.bands.high.makeup);

    n.limiter.threshold.value = p.limiter.threshold;
    n.limiter.release.value = p.limiter.release;
    n.outGain.gain.value = dbToGain(p.outputTrim);
  }, [params]);

  useEffect(() => () => {
    stopPlayback();
    stopStemPreview();
    if (ctxRef.current) ctxRef.current.close();
  }, []);

  function updateParam(path, value) {
    setSelectedPreset(null);
    setParams((prev) => {
      const next = JSON.parse(JSON.stringify(prev));
      let obj = next;
      for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
      obj[path[path.length - 1]] = value;
      return next;
    });
  }

  function applyPreset(key) {
    const preset = PRESETS[key];
    if (!preset) return;
    setParams(JSON.parse(JSON.stringify(preset.params)));
    setSelectedPreset(key);
  }

  function saveCustomPreset() {
    const name = newPresetName.trim();
    if (!name) return;
    const next = [...customPresets.filter((p) => p.name !== name), { name, params: JSON.parse(JSON.stringify(params)) }];
    setCustomPresets(next);
    try { localStorage.setItem("masteringConsoleCustomPresets", JSON.stringify(next)); } catch (err) {}
    setNewPresetName("");
    setSelectedPreset(`custom:${name}`);
  }

  function applyCustomPreset(name) {
    const preset = customPresets.find((p) => p.name === name);
    if (!preset) return;
    setParams(JSON.parse(JSON.stringify(preset.params)));
    setSelectedPreset(`custom:${name}`);
  }

  function deleteCustomPreset(name) {
    const next = customPresets.filter((p) => p.name !== name);
    setCustomPresets(next);
    try { localStorage.setItem("masteringConsoleCustomPresets", JSON.stringify(next)); } catch (err) {}
  }

  function stopStemPreview() {
    Object.values(stemPreviewNodesRef.current).forEach((n) => {
      try { n.source.stop(); } catch (err) {}
      try { n.source.disconnect(); } catch (err) {}
    });
    stemPreviewNodesRef.current = {};
    setStemPreviewPlaying(false);
  }

  function playStemPreview() {
    if (!stems.length) return;
    stopPlayback();
    stopStemPreview();
    const ctx = ensureCtx();
    if (ctx.state === "suspended") { ctx.resume(); }
    const anySolo = stems.some((s) => s.solo);
    const nodesMap = {};
    stems.forEach((s) => {
      const active = anySolo ? s.solo : !s.mute;
      const src = ctx.createBufferSource();
      src.buffer = s.buffer;
      const lowShelf = ctx.createBiquadFilter();
      lowShelf.type = "lowshelf";
      lowShelf.frequency.value = 150;
      lowShelf.gain.value = s.lowGain;
      const highShelf = ctx.createBiquadFilter();
      highShelf.type = "highshelf";
      highShelf.frequency.value = 6000;
      highShelf.gain.value = s.highGain;
      const gain = ctx.createGain();
      gain.gain.value = active ? dbToGain(s.gainDb) : 0;
      src.connect(lowShelf);
      lowShelf.connect(highShelf);
      highShelf.connect(gain);
      gain.connect(ctx.destination);
      src.start(0);
      nodesMap[s.id] = { source: src, gain, lowShelf, highShelf };
    });
    stemPreviewNodesRef.current = nodesMap;
    setStemPreviewPlaying(true);
  }

  function toggleStemPreview() {
    if (stemPreviewPlaying) stopStemPreview();
    else playStemPreview();
  }

  useEffect(() => {
    if (!stemPreviewPlaying || !ctxRef.current) return;
    const ctx = ctxRef.current;
    const anySolo = stems.some((s) => s.solo);
    stems.forEach((s) => {
      const n = stemPreviewNodesRef.current[s.id];
      if (!n) return;
      const active = anySolo ? s.solo : !s.mute;
      n.gain.gain.setTargetAtTime(active ? dbToGain(s.gainDb) : 0, ctx.currentTime, 0.01);
      n.lowShelf.gain.value = s.lowGain;
      n.highShelf.gain.value = s.highGain;
    });
  }, [stems, stemPreviewPlaying]);

  async function handleStemFiles(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const ctx = ensureCtx();
    const newStems = [];
    for (const file of files) {
      try {
        const arrayBuf = await file.arrayBuffer();
        const audioBuffer = await ctx.decodeAudioData(arrayBuf);
        stemIdRef.current += 1;
        newStems.push({
          id: stemIdRef.current,
          name: file.name,
          buffer: audioBuffer,
          gainDb: 0,
          mute: false,
          solo: false,
          lowGain: 0,
          highGain: 0,
        });
      } catch (err) {}
    }
    setStems((prev) => [...prev, ...newStems]);
    e.target.value = "";
  }

  function updateStem(id, patch) {
    setStems((prev) => prev.map((s) => (s.id === id ? { ...s, ...patch } : s)));
  }

  function removeStem(id) {
    setStems((prev) => prev.filter((s) => s.id !== id));
  }

  async function buildStemMixAndSend() {
    if (!stems.length) return;
    stopStemPreview();
    setMixing(true);
    const ctx = ensureCtx();
    const sampleRate = ctx.sampleRate;
    const anySolo = stems.some((s) => s.solo);
    const active = stems.filter((s) => (anySolo ? s.solo : !s.mute));
    if (!active.length) { setMixing(false); return; }
    const maxLen = Math.max(...active.map((s) => s.buffer.length));
    const offlineCtx = new OfflineAudioContext(2, maxLen, sampleRate);

    active.forEach((s) => {
      const src = offlineCtx.createBufferSource();
      src.buffer = s.buffer;
      const lowShelf = offlineCtx.createBiquadFilter();
      lowShelf.type = "lowshelf";
      lowShelf.frequency.value = 150;
      lowShelf.gain.value = s.lowGain;
      const highShelf = offlineCtx.createBiquadFilter();
      highShelf.type = "highshelf";
      highShelf.frequency.value = 6000;
      highShelf.gain.value = s.highGain;
      const gain = offlineCtx.createGain();
      gain.gain.value = dbToGain(s.gainDb);
      src.connect(lowShelf);
      lowShelf.connect(highShelf);
      highShelf.connect(gain);
      gain.connect(offlineCtx.destination);
      src.start(0);
    });

    const rendered = await offlineCtx.startRendering();
    bufferRef.current = rendered;
    setFileName("Stem Karışımı (" + active.length + " parça)");
    setDuration(rendered.duration);
    drawWaveform(rendered);
    setStatus("ready");
    setMixing(false);
    setActiveTab("konsol");
  }

  async function handleExport() {
    if (!bufferRef.current) return;
    setExporting(true);
    const buffer = bufferRef.current;
    const offlineCtx = new OfflineAudioContext(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = buffer;
    const chain = buildChain(offlineCtx, paramsRef.current);
    source.connect(chain.input);
    chain.output.connect(offlineCtx.destination);
    source.start(0);
    const rendered = await offlineCtx.startRendering();
    const blob = encodeWav(rendered);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (fileName ? fileName.replace(/\.[^.]+$/, "") : "mastered") + "_mastered.wav";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  }

          </div>
        )}

        {activeTab === "stemler" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, flex: 1, minHeight: 0 }}>
            <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hairline}`, padding: 10, fontSize: 10.5, color: COLORS.textSecondary, lineHeight: 1.5, flexShrink: 0 }}>
              UVR (veya benzeri) ile ayırdığın vokal, gitar, bas, davul gibi dosyaları buraya yükle. Her parçanın seviyesini ve tonunu ayrı ayrı ayarla (örneğin gitarı kıs, vokali öne çek), sonra <strong style={{ color: COLORS.amber }}>Karışımı Oluştur</strong> ile tek parçaya birleştirip Konsol'daki mastering zincirine gönder.
            </div>

            <div style={{ flexShrink: 0, display: "flex", gap: 8, alignItems: "center" }}>
              <input ref={stemFileInputRef} type="file" accept="audio/*" multiple onChange={handleStemFiles} style={{ display: "none" }} />
              <button onClick={() => stemFileInputRef.current.click()} style={btnStyle()}>+ Stem dosyası ekle</button>
              <button onClick={toggleStemPreview} disabled={!stems.length} style={btnStyle(stemPreviewPlaying)}>{stemPreviewPlaying ? "Durdur" : "Çal (önizleme)"}</button>
              <span style={{ fontSize: 9.5, color: COLORS.textMuted }}>Ayarları çalarken de değiştirebilirsin, anında duyulur.</span>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 6, flex: 1, minHeight: 0, overflow: "auto" }}>
              {stems.length === 0 && (
                <div style={{ fontSize: 11, color: COLORS.textMuted, textAlign: "center", padding: 20 }}>Henüz stem yüklenmedi.</div>
              )}
              {stems.map((s) => (
                <div key={s.id} className="stem-row" style={{ background: COLORS.panel, border: `1px solid ${COLORS.hairline}`, borderLeft: `3px solid ${s.mute ? COLORS.textMuted : COLORS.copper}`, padding: "8px 10px", display: "grid", gridTemplateColumns: "1.3fr 1fr 1fr 1fr auto", gap: 10, alignItems: "center" }}>
                  <span style={{ fontSize: 11.5, fontFamily: FONT_MONO, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name}</span>
                  <Slider label="Kazanç" value={s.gainDb} min={-24} max={12} step={0.5} unit=" dB" onChange={(v) => updateStem(s.id, { gainDb: v })} />
                  <Slider label="Bas" value={s.lowGain} min={-12} max={12} step={0.5} unit=" dB" onChange={(v) => updateStem(s.id, { lowGain: v })} />
                  <Slider label="Tiz" value={s.highGain} min={-12} max={12} step={0.5} unit=" dB" onChange={(v) => updateStem(s.id, { highGain: v })} />
                  <div style={{ display: "flex", gap: 4 }}>
                    <button onClick={() => updateStem(s.id, { mute: !s.mute })} style={{ ...btnStyle(s.mute), padding: "4px 8px", fontSize: 10 }}>M</button>
                    <button onClick={() => updateStem(s.id, { solo: !s.solo })} style={{ ...btnStyle(s.solo), padding: "4px 8px", fontSize: 10 }}>S</button>
                    <button onClick={() => removeStem(s.id)} style={{ ...btnStyle(), padding: "4px 8px", fontSize: 10, color: COLORS.red, borderColor: COLORS.red }}>×</button>
                  </div>
                </div>
              ))}
            </div>

            <div style={{ flexShrink: 0 }}>
              <button onClick={buildStemMixAndSend} disabled={!stems.length || mixing} style={{ ...btnStyle(true), padding: "8px 14px", fontSize: 12 }}>
                {mixing ? "Karıştırılıyor\u2026" : "Karışımı Oluştur ve Mastering'e Gönder"}
              </button>
            </div>
          </div>
        )}

        {activeTab === "rehber" && (
          <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hairline}`, padding: "12px 16px", overflow: "auto", flex: 1, minHeight: 0 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4px 24px", fontSize: 11.5, lineHeight: 1.5 }}>
              {[
                ["EQ (Ekolayzer)", "Belirli frekans bölgelerinin seviyesini artırıp azaltarak sesin tonal dengesini şekillendirir."],
                ["Raf (Shelf)", "Belirlenen frekansın altını (Bas Raf) veya üstünü (Tiz Raf) topluca yükseltir/azaltır."],
                ["Frekans", "Hangi ses bölgesinin (Hz cinsinden) etkileneceğini belirler. Düşük = bas, yüksek = tiz."],
                ["Kazanç (Gain)", "O frekans bölgesinin ne kadar artırılıp azaltılacağı, dB cinsinden."],
                ["Q (Bant Genişliği)", "EQ değişikliğinin ne kadar dar veya geniş bir frekans aralığını etkileyeceği."],
                ["Kompresör", "Belirli bir seviyenin üzerindeki sesi otomatik olarak kısarak dinamik aralığı daraltır, sesi daha tutarlı yapar."],
                ["Eşik (Threshold)", "Kompresörün devreye girmesi için sesin aşması gereken seviye."],
                ["Oran (Ratio)", "Eşiği aşan sesin ne kadar sıkıştırılacağı. 4:1 demek, eşiği aşan her 4 dB'lik artış 1 dB'ye indirilir."],
                ["Atak (Attack)", "Eşik aşıldıktan sonra kompresörün ne kadar hızlı devreye gireceği."],
                ["Bırakma (Release)", "Ses eşiğin altına düştükten sonra kompresörün ne kadar sürede normale döneceği."],
                ["Telafi Kazancı (Makeup Gain)", "Kompresyonla kaybedilen genel seviyeyi geri kazanmak için eklenen ekstra kazanç."],
                ["Geçiş Frekansı (Crossover)", "3 bantlı kompresörde bas/orta/tiz bölgelerinin birbirinden ayrıldığı frekans noktası."],
                ["Sınırlayıcı (Limiter)", "Sesin belirlenen bir tavanı (ör. -1 dB) kesinlikle aşmasını engelleyen çok hızlı, sert bir kompresör türü."],
                ["Çıkış Kazancı (Trim)", "Tüm zincirden sonra son genel ses seviyesini ince ayarlar."],
                ["Bypass", "İşlenmiş ve ham (orijinal) sesi karşılaştırmak için efektleri geçici olarak devre dışı bırakır."],
                ["Peak", "Anlık en yüksek ses genliği; 0 dB'yi geçerse dijital bozulma (clipping) olur."],
                ["RMS", "Sesin ortalama enerjisi; kulağın algıladığı 'yükseklik' hissine daha yakındır."],
                ["LUFS", "Yayın platformlarının kullandığı algısal yükseklik birimi. Spotify/YouTube Music yaklaşık -14 LUFS'a normalize eder."],
                ["Kazanç Azaltma (GR)", "Kompresörün o an sesi kaç dB kıstığını gösterir; sürekli yüksekse ayarlar çok agresif olabilir."],
                ["Stem", "Bitmiş bir şarkının vokal, gitar, bas, davul gibi ayrı ayrı çıkarılmış tek tek parçaları."],
                ["Mute (M) / Solo (S)", "Mute o parçayı karışımdan tamamen çıkarır. Solo işaretlenen parça(lar) varsa, sadece onlar çalar/karışıma girer."],
              ].map(([term, desc]) => (
                <div key={term} className="glossary-item" style={{ gridColumn: "span 2", display: "grid", gridTemplateColumns: "170px 1fr", gap: 10, borderBottom: `1px solid ${COLORS.hairline}`, padding: "5px 0" }}>
                  <span style={{ color: COLORS.amber, fontWeight: 500 }}>{term}</span>
                  <span style={{ color: COLORS.textSecondary }}>{desc}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <div style={{ fontSize: 9.5, color: COLORS.textMuted, textAlign: "center", borderTop: `1px solid ${COLORS.hairline}`, paddingTop: 5, flexShrink: 0 }}>
        Tüm işlem tarayıcında yerel olarak yapılır — dosyalar hiçbir sunucuya gönderilmez.
      </div>
    </div>
  );
}

function btnStyle(active) {
  return {
    background: active ? COLORS.copper : "transparent",
    color: active ? "#15130F" : COLORS.textPrimary,
    border: `1px solid ${active ? COLORS.copper : COLORS.hairline}`,
    padding: "5px 10px",
    fontSize: 11,
    fontFamily: FONT_DISPLAY,
    letterSpacing: "0.04em",
    cursor: "pointer",
    borderRadius: 2,
  };
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MasteringConsole />);
</script>
</body>
</html>
